
name: Folks Finance Foundry Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Staking Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Mytest
        run: forge test --match-path test/Mytest.t.sol -vvv
